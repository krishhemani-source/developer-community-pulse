<text x="50" y="1300" class="foot"><tspan font-weight="700">Reliability rule:</tspan> Gemini interprets, code counts, and nothing unverified reaches Sumit. Every API and AI output is schema-checked (zod); a failed source makes the run partial, not failed.</text>
<text x="50" y="1334" class="foot"><tspan font-weight="700">Human boundary:</tspan> The system measures and explains. Sprint decisions, config changes and any outreach stay with Sumit. No auto tickets, no auto replies, no “what to build” decisions.</text>
<text x="1950" y="1368" class="note" text-anchor="end">*Usernames are stored for attribution but never sent to Gemini · Dashed arrows show data flow · Purple = Gemini Flash · Orange = deterministic code</text>
</svg>